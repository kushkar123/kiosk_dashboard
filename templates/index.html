<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Kiosk</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0d14;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 12px 18px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f273d;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .time-box h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .time-box h3 {
            margin: 4px 0 0 0;
            color: #8f95b2;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Bareilly Weather Badge */
        .weather-box {
            background: linear-gradient(135deg, #182033, #121624);
            border: 1px solid #283552;
            border-radius: 10px;
            padding: 8px 18px;
            text-align: center;
            min-width: 22%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .weather-city {
            font-size: 0.9rem;
            font-weight: 700;
            color: #79a8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .weather-temp-cond {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 2px 0;
            color: #ffffff;
        }
        .weather-cond {
            font-size: 0.9rem;
            color: #b0b8d6;
            font-weight: 400;
            margin-left: 6px;
        }
        .weather-aqi {
            font-size: 0.85rem;
            color: #9aa2c2;
        }
        .aqi-pill {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.82rem;
            margin-left: 4px;
        }
        .aqi-good { background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid #00e676; }
        .aqi-moderate { background: rgba(255, 214, 0, 0.2); color: #ffd600; border: 1px solid #ffd600; }
        .aqi-unhealthy-sens { background: rgba(255, 145, 0, 0.2); color: #ff9100; border: 1px solid #ff9100; }
        .aqi-unhealthy { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid #ff5252; }

        /* German Vocabulary Flashcard */
        .flashcard {
            border: 1px solid #283552;
            padding: 8px 18px;
            border-radius: 10px;
            text-align: right;
            width: 32%;
            background: linear-gradient(135deg, #182033, #121624);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .flashcard h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #ffca28;
            font-weight: 700;
        }
        .flashcard p {
            margin: 3px 0 0 0;
            font-size: 0.88rem;
            color: #d1d5db;
            font-style: italic;
        }

        /* 3 Main Columns Layout */
        .grid {
            display: flex;
            flex: 1;
            gap: 14px;
            min-height: 0;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111420;
            border: 1px solid #1e263a;
            border-radius: 10px;
            padding: 12px 14px;
            overflow: hidden;
            min-height: 0;
        }
        h2.section-title {
            font-size: 1.15rem;
            margin: 0 0 10px 0;
            border-bottom: 2px solid #20293f;
            padding-bottom: 6px;
            color: #e2e8f0;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1a2236;
            color: #60a5fa;
            text-transform: uppercase;
        }

        /* Stock Movers (Gainers & Losers) Side-by-Side */
        .movers-container {
            display: flex;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }
        .movers-col {
            flex: 1;
            background: #090c13;
            border-radius: 8px;
            padding: 8px 10px;
            border: 1px solid #182033;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .movers-hdr {
            font-size: 0.88rem;
            font-weight: 700;
            padding-bottom: 6px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1d273f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .movers-hdr.gainers { color: #10b981; }
        .movers-hdr.losers { color: #f43f5e; }

        /* Clean Stock Row without Price: Just Ticker & Percentage Badge */
        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            background: #141826;
            min-width: 0;
        }
        .stock-sym {
            font-weight: 700;
            color: #f8fafc;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stock-chg {
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.88rem;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }
        .chg-pos { background: rgba(16, 185, 129, 0.16); color: #10b981; }
        .chg-neg { background: rgba(244, 63, 94, 0.16); color: #f43f5e; }

        /* News & Trends Feed Scroll */
        .feed-scroll {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            min-height: 0;
        }
        .feed-scroll::-webkit-scrollbar { width: 4px; }
        .feed-scroll::-webkit-scrollbar-thumb { background: #263352; border-radius: 4px; }

        .list-item {
            font-size: 0.88rem;
            margin-bottom: 8px;
            line-height: 1.35;
            color: #cbd5e1;
            padding: 7px 10px;
            border-radius: 6px;
            background: #0d101a;
            border-left: 3px solid #3b82f6;
        }
        .list-item.trend-item {
            border-left-color: #f59e0b;
        }
        .list-item.breaking-item {
            border-left-color: #ef4444;
        }

        .sub-header {
            font-size: 0.92rem;
            font-weight: 700;
            color: #f59e0b;
            margin: 4px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-header.breaking {
            color: #ef4444;
            margin-top: 10px;
        }

        /* Bottom Ticker Bar */
        .ticker-bar {
            background: linear-gradient(180deg, #131724 0%, #0d101a 100%);
            padding: 10px 18px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            border: 1px solid #20273c;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }
        .ticker-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .ticker-name {
            font-size: 0.84rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }
        .ticker-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }
        .ticker-badge {
            font-size: 0.82rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ticker-badge.positive {
            background: rgba(16, 185, 129, 0.16);
            color: #10b981;
        }
        .ticker-badge.negative {
            background: rgba(244, 63, 94, 0.16);
            color: #f43f5e;
        }
        .ticker-sep {
            width: 1px;
            height: 18px;
            background: #252e45;
        }

        /* Responsive Adaptations for 1366x768 & Laptops */
        @media (max-width: 1400px), (max-height: 800px) {
            body {
                padding: 8px 14px;
            }
            .header {
                padding-bottom: 6px;
                margin-bottom: 8px;
            }
            .time-box h1 { font-size: 2rem; }
            .time-box h3 { font-size: 0.8rem; }
            .weather-box { padding: 5px 12px; }
            .weather-temp-cond { font-size: 1.25rem; }
            .flashcard { padding: 5px 12px; }
            .flashcard h2 { font-size: 1.2rem; }
            .flashcard p { font-size: 0.8rem; }
            .grid { gap: 10px; }
            .col { padding: 9px 10px; }
            h2.section-title { font-size: 0.98rem; margin-bottom: 6px; padding-bottom: 4px; }
            .movers-hdr { font-size: 0.82rem; margin-bottom: 5px; }
            .stock-row { padding: 6px 8px; margin-bottom: 4px; }
            .stock-sym { font-size: 0.88rem; }
            .stock-chg { font-size: 0.8rem; padding: 2px 6px; }
            .list-item { font-size: 0.8rem; padding: 5px 8px; margin-bottom: 6px; }
            .sub-header { font-size: 0.84rem; margin: 3px 0 5px 0; }
            .ticker-bar { padding: 8px 14px; margin-top: 8px; }
            .ticker-name { font-size: 0.78rem; }
            .ticker-val { font-size: 0.92rem; }
            .ticker-badge { font-size: 0.76rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="time-box">
            <h1 id="clock">--:--</h1>
            <h3 id="date-mode">Loading...</h3>
        </div>

        <!-- Dedicated Bareilly Weather & AQI Center Widget -->
        <div class="weather-box" id="weather-box">
            <div class="weather-city">📍 Bareilly, UP</div>
            <div class="weather-temp-cond">
                <span id="bareilly-temp">--°C</span>
                <span class="weather-cond" id="bareilly-cond">Loading...</span>
            </div>
            <div class="weather-aqi">
                Air Quality: <span id="bareilly-aqi" class="aqi-pill aqi-moderate">AQI --</span>
            </div>
        </div>

        <!-- German Flashcard Widget -->
        <div class="flashcard">
            <h2 id="ger-word">Laden...</h2>
            <p id="ger-eng">Loading...</p>
            <p id="ger-sent"></p>
        </div>
    </div>

    <div class="grid">
        <!-- Column 1: Primary Focus (Movers Side-by-Side: Ticker & Percentage only) -->
        <div class="col">
            <h2 class="section-title">
                Primary Focus
                <span class="section-badge" id="primary-market-badge">Market Movers</span>
            </h2>
            <div class="movers-container">
                <div class="movers-col">
                    <div class="movers-hdr gainers">▲ Top 6 Gainers</div>
                    <div id="nasdaq-gainers" class="feed-scroll"></div>
                </div>
                <div class="movers-col">
                    <div class="movers-hdr losers">▼ Top 6 Losers</div>
                    <div id="nasdaq-losers" class="feed-scroll"></div>
                </div>
            </div>
        </div>

        <!-- Column 2: News & Buzz -->
        <div class="col">
            <h2 class="section-title">
                News & Buzz
                <span class="section-badge" id="news-mode-badge">Market News</span>
            </h2>
            <div id="news-data" class="feed-scroll"></div>
        </div>

        <!-- Column 3: Google Trends & India Breaking News -->
        <div class="col">
            <h2 class="section-title">
                Trends & India Wire
                <span class="section-badge">Live Feeds</span>
            </h2>
            <div class="feed-scroll">
                <div class="sub-header">🔥 Top 5 Viral Trends (India)</div>
                <div id="trends-data"></div>

                <div class="sub-header breaking">⚡ Top 5 Breaking News (India)</div>
                <div id="breaking-india-data"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Ticker Bar -->
    <div class="ticker-bar" id="ticker">
        <div class="ticker-item"><span class="ticker-name">Loading ticker...</span></div>
    </div>

    <script>
        function updateFlashcard() {
            fetch('/api/flashcard')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('ger-word').innerText = data.german;
                    document.getElementById('ger-eng').innerText = data.english;
                    document.getElementById('ger-sent').innerText = data.sentence;
                })
                .catch(() => {});
        }

        function getAqiClass(aqi) {
            const val = parseInt(aqi);
            if (isNaN(val)) return 'aqi-moderate';
            if (val <= 50) return 'aqi-good';
            if (val <= 100) return 'aqi-moderate';
            if (val <= 150) return 'aqi-unhealthy-sens';
            return 'aqi-unhealthy';
        }

        // Render stock rows with ONLY symbol and percentage change (no prices)
        function renderStockRows(stocks, containerId) {
            const container = document.getElementById(containerId);
            if (!stocks || stocks.length === 0) {
                container.innerHTML = '<div style="color:#64748b; padding:10px; font-size:0.85rem;">No data available</div>';
                return;
            }
            let html = '';
            stocks.forEach(s => {
                const isPos = s.change >= 0;
                const sign = isPos ? '+' : '';
                const chgClass = isPos ? 'chg-pos' : 'chg-neg';
                html += `
                    <div class="stock-row">
                        <span class="stock-sym">${s.name}</span>
                        <span class="stock-chg ${chgClass}">${sign}${s.change.toFixed(2)}%</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateDashboard() {
            fetch('/api/data')
                .then(r => r.json())
                .then(data => {
                    // Time, Date and Mode
                    document.getElementById('clock').innerText = data.time;
                    document.getElementById('date-mode').innerText = data.date + " • " + data.mode;
                    
                    if (data.news_badge) {
                        document.getElementById('news-mode-badge').innerText = data.news_badge;
                    }

                    // Bareilly Weather & AQI Update
                    if (data.weather) {
                        document.getElementById('bareilly-temp').innerText = data.weather.temp;
                        document.getElementById('bareilly-cond').innerText = data.weather.condition;
                        const aqiElem = document.getElementById('bareilly-aqi');
                        aqiElem.innerText = "AQI " + data.weather.aqi;
                        aqiElem.className = "aqi-pill " + getAqiClass(data.weather.aqi);
                    }

                    // Column 1: Primary Focus (Top 6 Gainers & Losers - Symbol & Percentage ONLY)
                    if (data.primary_focus) {
                        document.getElementById('primary-market-badge').innerText = data.primary_focus.market;
                        renderStockRows(data.primary_focus.gainers, 'nasdaq-gainers');
                        renderStockRows(data.primary_focus.losers, 'nasdaq-losers');
                    }

                    // Column 2: News & Buzz
                    let newsHtml = '';
                    if (data.news && data.news.length > 0) {
                        data.news.forEach(n => {
                            newsHtml += `<div class="list-item">${n.title}</div>`;
                        });
                    } else {
                        newsHtml = '<div style="color:#64748b; padding:10px;">Loading news...</div>';
                    }
                    document.getElementById('news-data').innerHTML = newsHtml;

                    // Column 3: Top 5 Viral Trends (India)
                    let trendsHtml = '';
                    if (data.trends && data.trends.length > 0) {
                        data.trends.forEach(t => {
                            trendsHtml += `<div class="list-item trend-item">🔥 ${t.title}</div>`;
                        });
                    } else {
                        trendsHtml = '<div style="color:#64748b; padding:10px;">Loading viral trends...</div>';
                    }
                    document.getElementById('trends-data').innerHTML = trendsHtml;

                    // Column 3: Top 5 Breaking News (India)
                    let breakingHtml = '';
                    if (data.breaking_india && data.breaking_india.length > 0) {
                        data.breaking_india.forEach(b => {
                            breakingHtml += `<div class="list-item breaking-item">⚡ ${b.title}</div>`;
                        });
                    } else {
                        breakingHtml = '<div style="color:#64748b; padding:10px;">Loading breaking news...</div>';
                    }
                    document.getElementById('breaking-india-data').innerHTML = breakingHtml;

                    // Bottom Ticker Bar: Nifty 50, Sensex, Gold, Silver, Brent, USD/INR
                    let tickerHtml = '';
                    if (data.ticker && data.ticker.length > 0) {
                        data.ticker.forEach((t, idx) => {
                            const isPos = t.change >= 0;
                            const badgeClass = isPos ? 'positive' : 'negative';
                            const sign = isPos ? '+' : '';
                            tickerHtml += `
                                <div class="ticker-item">
                                    <span class="ticker-name">${t.name}</span>
                                    <span class="ticker-val">${t.price}</span>
                                    <span class="ticker-badge ${badgeClass}">${sign}${t.change}%</span>
                                </div>
                            `;
                            if (idx < data.ticker.length - 1) {
                                tickerHtml += `<div class="ticker-sep"></div>`;
                            }
                        });
                    }
                    document.getElementById('ticker').innerHTML = tickerHtml;
                })
                .catch(err => {
                    console.error("Dashboard update failed:", err);
                });
        }

        setInterval(updateFlashcard, 30000);  // Update flashcard every 30 seconds
        setInterval(updateDashboard, 60000);  // Refresh dashboard data every 60 seconds
        updateFlashcard();
        updateDashboard();
    </script>
</body>
</html>
